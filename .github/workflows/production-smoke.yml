name: Production smoke

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public home
        run: curl --fail-with-body --location --retry 2 --retry-all-errors --max-time 20 https://medauraworld.com/ > /dev/null

      - name: Check liveness
        run: |
          body="$(curl --fail-with-body --retry 2 --retry-all-errors --max-time 20 https://medauraworld.com/api/health)"
          node -e 'const body=JSON.parse(process.argv[1]); if (body.status !== "ok") process.exit(1)' "$body"

      - name: Check database readiness
        run: |
          body="$(curl --fail-with-body --retry 2 --retry-all-errors --max-time 20 https://medauraworld.com/api/readiness)"
          node -e 'const body=JSON.parse(process.argv[1]); if (body.status !== "ready" || body.checks?.schemaReady !== true) process.exit(1)' "$body"
